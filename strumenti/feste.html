<style>

<script>
// feste: Natale, Hanukkah, Capodanno lunare, Ramadan ed Eid, Pasqua (anche ortodossa), Vesak, Diwali.
// Si attivano da sole per tutti, ovunque. Prova: ?stagione=natale|hanukkah|lunare|ramadan|eid|adha|pasqua|vesak|diwali
(function(){
  function fmt(d,cal,o){try{var p=new Intl.DateTimeFormat("en-u-ca-"+cal,o).formatToParts(d),r={};p.forEach(function(x){r[x.type]=x.value});return r}catch(e){return {}}}
  function add(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
  function md(d){return (d.getMonth()+1)*100+d.getDate()}
  function easter(y,jul){var a,b,c,d,e,m,day;if(jul){a=y%4;b=y%7;c=y%19;d=(19*c+15)%30;e=(2*a+4*b-d+34)%7;m=Math.floor((d+e+114)/31);day=(d+e+114)%31+1;var dt=new Date(y,m-1,day);return add(dt,Math.floor(y/100)-Math.floor(y/400)-2)}
    a=y%19;b=Math.floor(y/100);c=y%100;d=Math.floor(b/4);e=b%4;var f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,mm=Math.floor((a+11*h-22*l)/451);m=Math.floor((h+l-7*mm+114)/31);day=(h+l-7*mm+114)%31+1;return new Date(y,m-1,day)}
  function near(d,ref,before,after){var t=(d-ref)/864e5;return t>=-before-.5&&t<=after+.5}
  // Diwali e Vesak non hanno un calendario in Intl: date verificate anno per anno (Vesak varia da paese a paese)
  var DIWALI={2026:[11,8],2027:[10,29]},VESAK={2027:[5,20]};
  var F={
    natale:function(d){var x=md(d);return x>=1208||x<=106},
    hanukkah:function(d){for(var i=0;i<9;i++){var p=fmt(add(d,-i),"hebrew",{month:"long",day:"numeric"});if(p.month==="Kislev"&&+p.day===24)return true}return false},
    lunare:function(d){for(var i=-1;i<15;i++){var p=fmt(add(d,-i),"chinese",{month:"numeric",day:"numeric"});if(p.month==="1"&&+p.day===1)return true}return false},
    ramadan:function(d){return fmt(d,"islamic-umalqura",{month:"numeric"}).month==="9"},
    eid:function(d){var p=fmt(d,"islamic-umalqura",{month:"numeric",day:"numeric"});return p.month==="10"&&+p.day<=3},
    adha:function(d){var p=fmt(d,"islamic-umalqura",{month:"numeric",day:"numeric"});return p.month==="12"&&+p.day>=10&&+p.day<=13},
    pasqua:function(d){var y=d.getFullYear();return near(d,easter(y),7,1)||near(d,easter(y,true),7,1)},
    vesak:function(d){var v=VESAK[d.getFullYear()];return !!v&&near(d,new Date(d.getFullYear(),v[0]-1,v[1]),3,3)},
    diwali:function(d){var v=DIWALI[d.getFullYear()];return !!v&&near(d,new Date(d.getFullYear(),v[0]-1,v[1]),2,2)}
  };
  var NOMI={natale:"Natale|Christmas|Noël|Weihnachten|Navidad|Natal|Рождество|عيد الميلاد|圣诞节|クリスマス|크리스마스",
    hanukkah:"Hanukkah|Hanukkah|Hanoucca|Chanukka|Janucá|Hanukkah|Ханука|حانوكا|光明节|ハヌカー|하누카",
    lunare:"Capodanno lunare|Lunar New Year|Nouvel An lunaire|Mondneujahr|Año Nuevo lunar|Ano Novo Lunar|Лунный Новый год|رأس السنة القمرية|春节|旧正月|설날",
    ramadan:"Ramadan|Ramadan|Ramadan|Ramadan|Ramadán|Ramadã|Рамадан|رمضان|斋月|ラマダーン|라마단",
    eid:"Eid al-Fitr|Eid al-Fitr|Aïd el-Fitr|Fest des Fastenbrechens|Eid al-Fitr|Eid al-Fitr|Ураза-байрам|عيد الفطر|开斋节|イード・アル＝フィトル|이드 알피트르",
    adha:"Eid al-Adha|Eid al-Adha|Aïd el-Kebir|Opferfest|Eid al-Adha|Eid al-Adha|Курбан-байрам|عيد الأضحى|古尔邦节|イード・アル＝アドハー|이드 알아드하",
    pasqua:"Pasqua|Easter|Pâques|Ostern|Pascua|Páscoa|Пасха|عيد الفصح|复活节|復活祭|부활절",
    vesak:"Vesak|Vesak|Vesak|Vesakh|Vesak|Vesak|Весак|فيساك|卫塞节|ウェーサーカ祭|베삭",
    diwali:"Diwali|Diwali|Diwali|Diwali|Diwali|Diwali|Дивали|ديوالي|排灯节|ディーワーリー|디왈리"};
  var WIKI={natale:"Natale|Christmas|Noël|Weihnachten|Navidad|Natal|Рождество Христово|عيد الميلاد|圣诞节|クリスマス|크리스마스",
    hanukkah:"Hanukkah|Hanukkah|Hanoucca|Chanukka|Janucá|Hanukkah|Ханука|حانوكا|光明节|ハヌカー|하누카",
    lunare:"Capodanno cinese|Lunar New Year|Nouvel An chinois|Chinesisches Neujahrsfest|Año Nuevo chino|Ano-novo chinês|Китайский Новый год|رأس السنة الصينية|春节|春節|설날",
    ramadan:"Ramadan|Ramadan|Ramadan|Ramadan|Ramadán|Ramadã|Рамадан|رمضان|斋月|ラマダーン|라마단",
    eid:"Id al-fitr|Eid al-Fitr|Aïd el-Fitr|Fest des Fastenbrechens|Eid al-Fitr|Eid al-Fitr|Ураза-байрам|عيد الفطر|开斋节|イド・アル＝フィトル|이드 알피트르",
    adha:"Id al-adha|Eid al-Adha|Aïd el-Kebir|Opferfest|Eid al-Adha|Eid al-Adha|Курбан-байрам|عيد الأضحى|古尔邦节|イード・アル＝アドハー|이드 알아드하",
    pasqua:"Pasqua|Easter|Pâques|Ostern|Pascua|Páscoa|Пасха|عيد الفصح|复活节|復活祭|부활절",
    vesak:"Vesak|Vesak|Vesak|Vesakh|Vesak|Vesak|Весак|فيساك|卫塞节|ウェーサーカ祭|베삭",
    diwali:"Diwali|Diwali|Diwali|Diwali|Diwali|Diwali|Дивали|ديوالي|排灯节|ディーワーリー|디왈리"};
  var LANGS=["it","en","fr","de","es","pt","ru","ar","zh","ja","ko"],COS="Che cos'è|What is it|Qu'est-ce que c'est|Was ist das|Qué es|O que é|Что это|ما هذا|了解更多|詳しく|알아보기".split("|");
  var oggi=new Date(),m=/[?&]stagione=(\w+)/.exec(location.search),attive=[];
  // feste approvate da Marco: le altre si vedono solo in anteprima con ?stagione=
  var OK=["natale"];
  if(m&&F[m[1]])attive=[m[1]];else for(var k in F)if(OK.indexOf(k)>=0&&F[k](oggi))attive.push(k);
  if(!attive.length)return;
  // più feste insieme: si alternano un giorno l'una e un giorno l'altra
  var festa=attive[Math.floor(oggi/864e5)%attive.length];
  var ORN={natale:'<path d="M10 46 C18 26 30 10 46 8 C54 7 58 14 54 22 C50 18 46 18 44 22 C40 30 42 40 44 46 Z" fill="#c8202f"/><rect x="6" y="42" width="44" height="12" rx="6" fill="#f4f4f2"/><circle cx="55" cy="24" r="7" fill="#f4f4f2"/>',
    hanukkah:'<g stroke="#d9b45a" stroke-width="3" fill="none" stroke-linecap="round"><path d="M32 22v30M14 52h36"/><path d="M8 22c0 16 48 16 48 0M16 22c0 10 32 10 32 0M24 22c0 5 16 5 16 0"/></g><g fill="#ffcf5a">'+[8,16,24,32,40,48,56].map(function(x){return '<path d="M'+x+' 20c-2-3 0-6 0-8c0 2 2 5 0 8z"/>'}).join("")+'</g>',
    lunare:'<path d="M32 6v6" stroke="#d9b45a" stroke-width="2"/><ellipse cx="32" cy="30" rx="18" ry="16" fill="#d42a2a"/><path d="M20 30h24M32 14v32" stroke="#a51b1b" stroke-width="2"/><rect x="24" y="12" width="16" height="4" rx="1" fill="#d9b45a"/><rect x="24" y="44" width="16" height="4" rx="1" fill="#d9b45a"/><path d="M32 48v12" stroke="#d9b45a" stroke-width="2"/>',
    ramadan:'<path d="M40 8a24 24 0 1 0 14 40A20 20 0 1 1 40 8z" fill="#f2d27a"/><path d="M52 14l1.6 4.4 4.4 1.6-4.4 1.6-1.6 4.4-1.6-4.4-4.4-1.6 4.4-1.6z" fill="#f2d27a"/>',
    pasqua:'<ellipse cx="32" cy="34" rx="18" ry="24" fill="#f2c6d6"/><path d="M15 30c6-4 11 4 17 0s11 4 17 0M15 40c6 4 11-4 17 0s11-4 17 0" stroke="#7fb3e0" stroke-width="3" fill="none"/>',
    vesak:'<g fill="#f3b6c8"><path d="M32 14c8 10 8 22 0 32c-8-10-8-22 0-32z"/><path d="M32 46c-4-12-14-18-24-18c2 10 12 18 24 18zM32 46c4-12 14-18 24-18c-2 10-12 18-24 18z" opacity=".85"/></g><path d="M8 50h48" stroke="#7fc7a0" stroke-width="3" stroke-linecap="round"/>',
    diwali:'<path d="M10 40h44c-2 10-12 16-22 16S12 50 10 40z" fill="#c9783a"/><path d="M32 38c-6-8 0-18 0-26c0 8 7 16 0 26z" fill="#ffcf5a"/><path d="M32 36c-3-5 0-10 0-14c0 4 3 9 0 14z" fill="#fff3c4"/>'};
  ORN.eid=ORN.ramadan;ORN.adha=ORN.ramadan;
  var h=document.querySelector(".fc-h");
  if(h){h.classList.add("fest-on");h.insertAdjacentHTML("afterbegin",'<svg class="fest-orn" viewBox="0 0 64 64" aria-hidden="true">'+ORN[festa]+'</svg>')}
  var host=document.querySelector("#fc-map .map-wrap")||document.getElementById("fc-map");if(!host)return;
  if(getComputedStyle(host).position==="static")host.style.position="relative";
  var chip=document.createElement("a");chip.className="fest-chip";chip.target="_blank";chip.rel="noopener";host.appendChild(chip);
  function lab(){var l=(document.documentElement.lang||"it").slice(0,2),i=Math.max(0,LANGS.indexOf(l));
    chip.innerHTML=NOMI[festa].split("|")[i]+' <i>· '+COS[i]+' ↗</i>';chip.setAttribute("translate","no");
    chip.href="https://"+LANGS[i]+".wikipedia.org/wiki/Special:Search/"+encodeURIComponent(WIKI[festa].split("|")[i])}
  lab();addEventListener("lingua",lab);
  if(document.documentElement.classList.contains("lite"))return;
  var c=document.createElement("canvas");c.className="fest-cv";c.setAttribute("aria-hidden","true");host.appendChild(c);
  var x=c.getContext("2d"),W=0,H=0,R=Math.min(2,window.devicePixelRatio||1),P=[],t=0,still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function rnd(a,b){return a+Math.random()*(b-a)}
  function size(){W=c.clientWidth;H=c.clientHeight;c.width=W*R;c.height=H*R;x.setTransform(R,0,0,R,0,0)}
  function fade(y){var u=y/H;return u<.08?Math.max(0,u/.08):Math.max(0,1-(u-.35)/.65)}
  function rise(y){var u=y/H;return u>.9?(1-u)/.1:Math.max(0,u/.9)}
  function flake(f,al){x.save();x.translate(f.x,f.y);x.rotate(f.a);x.globalAlpha=al;x.strokeStyle="#e9f3ff";x.lineWidth=Math.max(.8,f.r/7);x.lineCap="round";x.beginPath();
    for(var i=0;i<6;i++){x.rotate(Math.PI/3);x.moveTo(0,0);x.lineTo(0,-f.r);x.moveTo(0,-f.r*.55);x.lineTo(f.r*.25,-f.r*.78);x.moveTo(0,-f.r*.55);x.lineTo(-f.r*.25,-f.r*.78)}x.stroke();x.restore()}
  function glow(px,py,r,col,al){var g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,col);g.addColorStop(1,"rgba(0,0,0,0)");x.globalAlpha=al;x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,7);x.fill();x.globalAlpha=1}
  function flame(px,py,s){var fl=1+Math.sin(t*.3+px)*.12+Math.random()*.06;glow(px,py-s*.6,s*2.2,"rgba(255,190,80,.55)",.9);x.fillStyle="#ffcf5a";x.beginPath();x.moveTo(px,py-s*1.6*fl);x.quadraticCurveTo(px+s*.6,py-s*.4,px,py);x.quadraticCurveTo(px-s*.6,py-s*.4,px,py-s*1.6*fl);x.fill();x.fillStyle="#fff3c4";x.beginPath();x.ellipse(px,py-s*.35,s*.18,s*.38,0,0,7);x.fill()}
  function lantern(px,py,s,sw,col,kind){x.save();x.translate(px,0);x.rotate(Math.sin(t*.02+px)*sw);x.strokeStyle="rgba(217,180,90,.8)";x.lineWidth=1;x.beginPath();x.moveTo(0,0);x.lineTo(0,py-s);x.stroke();x.translate(0,py);
    glow(0,0,s*2.4,kind==="red"?"rgba(255,80,60,.45)":"rgba(255,200,110,.45)",1);
    if(kind==="red"){x.fillStyle=col;x.beginPath();x.ellipse(0,0,s*1.1,s,0,0,7);x.fill();x.strokeStyle="rgba(120,10,10,.6)";x.beginPath();x.ellipse(0,0,s*.45,s,0,0,7);x.stroke();x.fillStyle="#d9b45a";x.fillRect(-s*.45,-s*1.15,s*.9,s*.25);x.fillRect(-s*.45,s*.9,s*.9,s*.25);x.strokeStyle="#d9b45a";x.beginPath();x.moveTo(0,s*1.15);x.lineTo(0,s*1.9);x.stroke()}
    else{x.fillStyle="#c9a24a";x.beginPath();x.moveTo(-s*.5,-s);x.lineTo(s*.5,-s);x.lineTo(s*.8,-s*.4);x.lineTo(-s*.8,-s*.4);x.fill();x.fillStyle="rgba(255,214,130,.9)";x.beginPath();x.moveTo(-s*.8,-s*.4);x.lineTo(s*.8,-s*.4);x.lineTo(s*.6,s*.7);x.lineTo(-s*.6,s*.7);x.fill();x.strokeStyle="#8a6a24";x.lineWidth=1.2;x.beginPath();x.moveTo(0,-s*.4);x.lineTo(0,s*.7);x.moveTo(-s*.7,s*.15);x.lineTo(s*.7,s*.15);x.stroke();x.fillStyle="#c9a24a";x.beginPath();x.moveTo(-s*.6,s*.7);x.lineTo(s*.6,s*.7);x.lineTo(0,s*1.3);x.fill()}
    x.restore()}
  function star(px,py,r,al){x.globalAlpha=al;x.fillStyle="#fff1c2";x.beginPath();for(var i=0;i<8;i++){var a=i*Math.PI/4,rr=i%2?r*.35:r;x.lineTo(px+Math.cos(a)*rr,py+Math.sin(a)*rr)}x.fill();x.globalAlpha=1}
  function init(){P=[];var n=festa==="natale"?46:festa==="pasqua"?34:28;for(var i=0;i<n;i++)P.push(part(true));
    if(festa==="lunare"||festa==="ramadan"||festa==="eid"||festa==="adha"){x.L=[];var k=Math.max(5,Math.round(W/170));for(var j=0;j<k;j++)x.L.push({x:(j+.5)*W/k+rnd(-30,30),y:rnd(H*.25,H*.6),s:rnd(9,14)})}}
  function part(s){var p={x:rnd(0,W),y:s?rnd(0,H):-10,r:rnd(5,13),v:rnd(.25,.7),w:rnd(0,6.28),a:rnd(0,6.28),sp:rnd(-.01,.01),c:["#f6c8d8","#fbe3a6","#cfe8c4","#cfe0fb"][Math.floor(Math.random()*4)]};
    if(festa==="vesak"||festa==="diwali"||festa==="hanukkah"){p.y=s?rnd(0,H):H+10;p.v=-rnd(.2,.5)}if(festa==="lunare"){p.r=rnd(1.5,3);p.v=rnd(.3,.8)}if(festa==="ramadan"||festa==="eid"||festa==="adha"){p.r=rnd(1.5,4);p.v=0;p.y=rnd(0,H*.8)}return p}
  function frame(){if(c.clientWidth&&(c.clientWidth!==W||c.clientHeight!==H)){size();init()}x.clearRect(0,0,W,H);t++;
    if(festa==="ramadan"||festa==="eid"||festa==="adha"){var mx=W*.86,my=H*.32;glow(mx,my,60,"rgba(255,226,150,.25)",1);x.fillStyle="#f2d27a";x.beginPath();x.arc(mx,my,20,0,7);x.fill();x.globalCompositeOperation="destination-out";x.beginPath();x.arc(mx+9,my-6,18,0,7);x.fill();x.globalCompositeOperation="source-over"}
    if(festa==="hanukkah"){var bx=W*.12,by=H*.82,sp=Math.min(22,W/60);x.strokeStyle="#d9b45a";x.lineWidth=3;x.lineCap="round";x.beginPath();x.moveTo(bx,by);x.lineTo(bx,by+30);x.moveTo(bx-30,by+30);x.lineTo(bx+30,by+30);for(var a=1;a<=4;a++){x.moveTo(bx-a*sp,by);x.quadraticCurveTo(bx-a*sp,by+a*6+8,bx,by+a*6+8);x.quadraticCurveTo(bx+a*sp,by+a*6+8,bx+a*sp,by)}x.stroke();for(var q=-4;q<=4;q++)flame(bx+q*sp,by-(q===0?8:0),5)}
    if(festa==="diwali"){var nd=Math.max(6,Math.round(W/120));for(var e=0;e<nd;e++){var dx=(e+.5)*W/nd,dy=H*.9;x.fillStyle="#c9783a";x.beginPath();x.moveTo(dx-14,dy-4);x.quadraticCurveTo(dx,dy+12,dx+14,dy-4);x.fill();flame(dx,dy-4,6)}}

    P.forEach(function(p,i){if(!still){p.y+=p.v;p.w+=.012;p.x+=Math.sin(p.w)*.35;p.a+=p.sp}
      if(festa==="natale"){var al=fade(p.y);if(p.y>H)P[i]=part(false);flake(p,al*.9)}
      else if(festa==="pasqua"){var al2=fade(p.y);if(p.y>H)P[i]=part(false);x.save();x.translate(p.x,p.y);x.rotate(p.a);x.globalAlpha=al2*.85;x.fillStyle=p.c;x.beginPath();x.ellipse(0,0,p.r*.55,p.r*.32,0,0,7);x.fill();x.restore();x.globalAlpha=1}
      else if(festa==="lunare"){var al3=fade(p.y);if(p.y>H)P[i]=part(false);star(p.x,p.y,p.r*1.6,al3*.9)}
      else if(festa==="ramadan"||festa==="eid"||festa==="adha"){star(p.x,p.y,p.r*1.4,.35+.35*Math.sin(t*.03+i))}
      else{var al4=rise(p.y);if(p.y<-10)P[i]=part(false);if(festa==="vesak"){glow(p.x,p.y,p.r*2,"rgba(255,200,140,.5)",al4);x.globalAlpha=al4;x.fillStyle="rgba(255,226,170,.95)";x.beginPath();x.roundRect?x.roundRect(p.x-p.r*.5,p.y-p.r*.7,p.r,p.r*1.3,3):x.rect(p.x-p.r*.5,p.y-p.r*.7,p.r,p.r*1.3);x.fill();x.globalAlpha=1}else glow(p.x,p.y,p.r*.6,festa==="hanukkah"?"rgba(190,215,255,.9)":"rgba(255,190,90,.9)",al4*.8)}
    });requestAnimationFrame(frame)}
  frame();
})();
</script>
